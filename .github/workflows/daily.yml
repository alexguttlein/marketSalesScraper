name: Informe diario de promos

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 07:00 en Argentina
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrapear Carrefour
        run: python scrape_carrefour.py

      - name: Generar informe
        run: python build_report.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar resultados en el repo
        if: always()
        run: |
          git config user.name "promos-bot"
          git config user.email "promos-bot@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || (git commit -m "Informe $(date -u +%F)" && git push)
